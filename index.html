<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hosting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .image-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        
        .image-info {
            padding: 15px;
            background: #f8f9fa;
        }
        
        .image-name {
            font-size: 14px;
            color: #495057;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }
        
        .no-images {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Image Gallery</h1>
        <div class="gallery">
            <div class="image-card">
                <img src="47914ccf-8855-4e3f-b7fa-3f07d7f1c585.png" alt="47914ccf-8855-4e3f-b7fa-3f07d7f1c585">
                <div class="image-info">
                    <div class="image-name">47914ccf-8855-4e3f-b7fa-3f07d7f1c585.png</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
